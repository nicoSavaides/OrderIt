    @keyframes shake {
  0%   { transform: translateX(0);  background-color: #A7A6A4; }
  10%  { transform: translateX(-9px); background-color: #A7A6A4; }
  20%  { transform: translateX(9px);  background-color: #A7A6A4; }
  30%  { transform: translateX(-7px); background-color: #A7A6A4; }
  40%  { transform: translateX(7px);  background-color: #A7A6A4; }
  50%  { transform: translateX(-5px); background-color: #A7A6A4; }
  60%  { transform: translateX(5px);  background-color: #A7A6A4; }
  70%  { transform: translateX(0);   background-color: #A7A6A4; }
  90%  { transform: translateX(0);   background-color: #A7A6A4; }
  100% { transform: translateX(0);   background-color: #A7A6A4; }
}



.shake li {
  animation: shake 1.1s ease-in-out;
  border: 1px solid #A7A6A4 !important; 
}



@keyframes flash-green {
  0% { background-color: transparent; }
  20%, 100% { background-color: #62a65b; } /* stays green at the end */
}


@keyframes grow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}



.correct-animation li {
  display: inline-block;
  animation: 
    flash-green 1.2s ease-in-out forwards,
    grow 1.2s ease-in-out forwards;
  transform-origin: center center;
  will-change: transform;
  border: 1px solid #62a65b !important; /* Matches tile bg */
}

function makeItemsDraggable() {
  const items = document.querySelectorAll('.draggable-item');
  let draggedItem = null;
  let draggedItemInitialPos = { x: 0, y: 0 };
  let offsetX = 0;
  let offsetY = 0;

  items.forEach(item => {
    item.setAttribute('draggable', true);

    // Desktop drag
    item.addEventListener('dragstart', () => {
      draggedItem = item;
      draggedItem.classList.add('dragging');
      setTimeout(() => {
        draggedItem.style.opacity = '0.5';
      }, 0);
    });

    item.addEventListener('dragend', () => {
      if (!draggedItem) return;
      draggedItem.style.opacity = '';
      draggedItem.classList.remove('dragging');
      draggedItem = null;
    });

    item.addEventListener('dragover', e => {
      e.preventDefault();
      if (draggedItem && draggedItem !== item) {
        const list = item.parentNode;
        const draggedIndex = Array.from(list.children).indexOf(draggedItem);
        const targetIndex = Array.from(list.children).indexOf(item);

        if (draggedIndex < targetIndex) {
          list.insertBefore(draggedItem, item.nextSibling);
        } else {
          list.insertBefore(draggedItem, item);
        }
      }
    });

    // Touch drag (mobile)
    item.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      draggedItem = item;
      draggedItemInitialPos = { x: touch.pageX, y: touch.pageY };
      offsetX = 0;
      offsetY = 0;

      draggedItem.classList.add('dragging');
      draggedItem.style.transition = 'none';
      draggedItem.style.zIndex = '1000';
      draggedItem.style.opacity = '0.7';
    });

    item.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!draggedItem) return;

      const touch = e.touches[0];
      offsetX = touch.pageX - draggedItemInitialPos.x;
      offsetY = touch.pageY - draggedItemInitialPos.y;

      // Move dragged item under finger
      draggedItem.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

      // Hide to detect element under finger
      draggedItem.style.visibility = 'hidden';
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      draggedItem.style.visibility = 'visible';

      if (!el) return;
      const targetItem = el.closest('.draggable-item');
      const list = draggedItem.parentNode;

      if (targetItem && targetItem !== draggedItem && list.contains(targetItem)) {
        const draggedIndex = Array.from(list.children).indexOf(draggedItem);
        const targetIndex = Array.from(list.children).indexOf(targetItem);

        const targetRect = targetItem.getBoundingClientRect();
        const middleY = targetRect.top + targetRect.height / 2;

        if ((offsetY > 0 && touch.clientY > middleY && draggedIndex < targetIndex) ||
            (offsetY < 0 && touch.clientY < middleY && draggedIndex > targetIndex)) {

          // Before reordering, measure position
          const beforeRect = draggedItem.getBoundingClientRect();

          if (draggedIndex < targetIndex) {
            list.insertBefore(draggedItem, targetItem.nextSibling);
          } else {
            list.insertBefore(draggedItem, targetItem);
          }

          // After reordering, measure new position
          const afterRect = draggedItem.getBoundingClientRect();
          const deltaY = beforeRect.top - afterRect.top;
          const deltaX = beforeRect.left - afterRect.left;

          // Adjust offset to cancel visual jump
          offsetX += deltaX;
          offsetY += deltaY;
          draggedItemInitialPos.x -= deltaX;
          draggedItemInitialPos.y -= deltaY;

          draggedItem.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
        }
      }
    });

    item.addEventListener('touchend', () => {
      if (!draggedItem) return;

      draggedItem.style.transition = '';
      draggedItem.style.transform = '';
      draggedItem.style.opacity = '';
      draggedItem.style.zIndex = '';
      draggedItem.classList.remove('dragging');

      draggedItem = null;
    });
  });
}

function updateStats(roundsCompleted) {
  const stats = JSON.parse(localStorage.getItem("orderItStats")) || {
    gamesPlayed: 0,
    rounds0: 0,
    rounds1: 0,
    rounds2: 0,
    rounds3: 0
  };

  const key = `rounds${roundsCompleted}`;
  if (stats[key] !== undefined) {
    stats[key]++;
  }

  // Increment games played
  stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;

  localStorage.setItem("orderItStats", JSON.stringify(stats));
}

function markGameAsPlayed() {
  const now = new Date();
  const todayString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  localStorage.setItem('lastPlayedDate', todayString);
  
  let gamesPlayed = parseInt(localStorage.getItem('gamesPlayed')) || 0;
  gamesPlayed += 1;
  localStorage.setItem('gamesPlayed', gamesPlayed);
}




function alreadyPlayedToday() {
  const lastPlayed = localStorage.getItem('lastPlayedDate');
  if (!lastPlayed) return false;

  const now = new Date();
  const todayString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return lastPlayed === todayString;
}
